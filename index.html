<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <title>一段 · 英语陪学营</title>

  <style>
:root {
  color-scheme: light;
  --canvas: #f8f7f3;
  --surface: #fffefa;
  --sidebar: #f1f2eb;
  --ink: #1c3026;
  --body-copy: #465349;
  --muted: #6d766c;
  --pine: #245b49;
  --pine-hover: #194936;
  --pine-soft: #e8ede3;
  --orange: #dc7953;
  --orange-soft: #f2e4d9;
  --line: #e0e3d8;
  --line-strong: #cdd3c5;
  --sidebar-width: 232px;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
}

* { box-sizing: border-box; }
html { min-width: 320px; min-height: 100%; background: var(--canvas); }
body {
  margin: 0;
  min-width: 320px;
  color: var(--ink);
  background: var(--canvas);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button, a, summary { touch-action: manipulation; }
button, summary { cursor: pointer; }
button:disabled { cursor: default; }
a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 4px; }
p { margin: 0 0 1em; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; line-height: 1.35; }
h1, h2, h3, p, li, button, a, span { overflow-wrap: break-word; }
strong { font-weight: 600; }
svg, img { max-width: 100%; vertical-align: middle; }
button svg, a svg { flex-shrink: 0; }
.icon { display: inline-block; width: 20px; height: 20px; flex: 0 0 auto; vertical-align: middle; }
:focus-visible { outline: 3px solid #b8893b; outline-offset: 3px; }
::selection { color: #153e2d; background: #dce7d2; }
.app-shell { min-height: 100vh; min-height: 100dvh; }

/* The shell stays quiet: one rail, one content surface, no stacked panels. */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  width: var(--sidebar-width);
  padding: 30px 22px 22px;
  overflow-y: auto;
  border-right: 1px solid var(--line);
  background: var(--sidebar);
}
.brand {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr);
  align-items: center;
  column-gap: 10px;
  margin: 0 8px 43px;
  color: var(--pine);
  text-decoration: none;
}
.brand-mark {
  grid-row: 1 / span 2;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 39px;
  color: var(--pine);
}
.brand-mark .icon { width: 30px; height: 30px; }
.brand-name { display: block; font-size: 23px; font-weight: 600; line-height: 1.3; letter-spacing: .08em; }
.brand-sub { display: block; color: var(--muted); font-size: 11px; line-height: 1.6; letter-spacing: .08em; }
.side-nav { display: grid; gap: 7px; }
.nav-button {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  min-height: 48px;
  padding: 11px 13px;
  border: 0;
  border-radius: 6px;
  color: var(--body-copy);
  background: transparent;
  font-size: 14px;
  font-weight: 500;
  text-align: left;
  text-decoration: none;
}
.side-nav .nav-button { width: 100%; }
.side-nav .nav-button:hover { color: var(--pine); background: #e9ece3; }
.side-nav .nav-button.active { color: var(--pine); background: #e1e8dc; }
.nav-icon { display: flex; align-items: center; justify-content: center; width: 21px; flex: 0 0 21px; }
.side-bottom { margin-top: auto; padding: 32px 8px 0; color: var(--muted); font-size: 12px; }
.side-bottom p { margin-bottom: 13px; }
.side-profile { display: flex; align-items: center; gap: 10px; margin-top: 19px; padding-top: 19px; border-top: 1px solid var(--line-strong); }
.side-profile > div { min-width: 0; }
.side-profile strong { display: block; color: var(--ink); font-size: 13px; }
.side-profile .small-copy { font-size: 11px; }
.profile-avatar, .avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  overflow: hidden;
  border-radius: 50%;
  color: var(--pine);
  background: #e2e9dc;
  font-size: 12px;
  font-weight: 600;
}
.profile-avatar img, .avatar img { width: 100%; height: 100%; object-fit: cover; }
.workspace { margin-left: var(--sidebar-width); min-width: 0; }
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  min-height: 78px;
  padding: 14px 44px;
  border-bottom: 1px solid var(--line);
}
.breadcrumb { min-width: 0; color: var(--muted); font-size: 12px; }
.breadcrumb strong, .breadcrumb .current { color: var(--ink); font-weight: 500; }
.breadcrumb .icon { width: 13px; height: 13px; margin: 0 8px; }
.top-actions { display: flex; align-items: center; gap: 15px; flex: 0 0 auto; }
.icon-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  min-width: 44px;
  padding: 10px;
  border: 0;
  border-radius: 6px;
  color: var(--body-copy);
  background: transparent;
}
.icon-button:hover { color: var(--pine); background: var(--pine-soft); }
.cohort-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
#main { width: min(1100px, calc(100% - 88px)); margin: 0 auto; padding: 35px 0 72px; }
.page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 22px; margin-bottom: 29px; }
.page-heading > div { min-width: 0; }
.eyebrow { margin: 0 0 8px; color: var(--pine); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
.page-heading h1 { font-size: 29px; font-weight: 600; letter-spacing: -.035em; }
.page-subtitle { max-width: 640px; margin: 10px 0 0; color: var(--muted); font-size: 13px; line-height: 1.8; }
.heading-actions { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 8px; flex: 0 0 auto; }
.today-grid { display: grid; grid-template-columns: minmax(0, 1fr) 270px; align-items: start; gap: 46px; }
.lesson-column, .right-rail { min-width: 0; }
.right-rail { padding-top: 2px; }

/* Today: an open editorial lesson, followed by readable practice lines. */
.lesson-hero { display: grid; grid-template-columns: minmax(0, 1fr) 142px; align-items: center; gap: 15px; padding: 29px 0 32px; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
.hero-copy { min-width: 0; }
.hero-kicker { margin: 0 0 14px; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; }
.hero-title { max-width: 490px; margin: 0; color: var(--pine); font-family: var(--serif); font-size: clamp(40px, 3.35vw, 53px); font-weight: 400; line-height: 1.09; letter-spacing: -.045em; }
.hero-cn { margin: 14px 0 16px; color: var(--body-copy); font-size: 15px; line-height: 1.65; }
.hero-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 15px; color: var(--muted); font-size: 11px; }
.hero-meta > span { display: inline-flex; align-items: center; gap: 5px; }
.hero-meta .icon { width: 14px; height: 14px; }
.hero-art { display: flex; align-items: center; justify-content: center; min-width: 0; color: var(--orange); }
.hero-art svg { display: block; width: 100%; max-width: 150px; height: auto; }
.section-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin: 24px 0 10px; }
.section-heading h2 { font-size: 17px; font-weight: 600; letter-spacing: -.025em; }
.text-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 0; border: 0; border-radius: 4px; color: var(--pine); background: transparent; font-size: 12px; font-weight: 500; text-decoration: none; }
.text-button .icon { width: 16px; height: 16px; }
.text-button:hover { color: var(--pine-hover); text-decoration: underline; text-underline-offset: 4px; }
.lesson-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 9px 14px; min-height: 46px; margin-bottom: 4px; }
.lesson-toolbar > div { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.pill { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: transparent; font-size: 11px; line-height: 1.5; }
.pill .icon { width: 13px; height: 13px; }
button.pill { min-height: 44px; }
.lesson-sentences { display: grid; gap: 0; }
.sentence-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) 44px; align-items: start; gap: 12px; min-width: 0; padding: 19px 0 20px; border-bottom: 1px solid var(--line); }
.sentence-index { padding-top: 5px; color: var(--muted); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11px; font-variant-numeric: tabular-nums; }
.sentence-text { min-width: 0; }
.sentence-en { margin: 0; color: var(--ink); font-size: 17px; font-weight: 500; line-height: 1.65; }
.sentence-zh { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.75; }
.sentence-play { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; min-width: 44px; padding: 11px; border: 1px solid var(--line); border-radius: 6px; color: var(--pine); background: transparent; }
.sentence-play .icon { width: 18px; height: 18px; }
.sentence-play:hover, .sentence-play.playing, .sentence-play.active { border-color: var(--pine); background: var(--pine-soft); }
.sentence-row.playing .sentence-en, .sentence-row.active .sentence-en { color: var(--pine); }
.study-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 15px; padding-top: 24px; }
.study-footer > .small-copy { flex: 1 1 140px; margin: 0; }
.primary-button, .secondary-button, .quiet-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 46px;
  max-width: 100%;
  padding: 11px 19px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 600;
  line-height: 1.6;
  text-align: center;
  text-decoration: none;
}
.primary-button { border-color: var(--pine); color: #fffefa; background: var(--pine); }
.primary-button:hover:not(:disabled) { border-color: var(--pine-hover); background: var(--pine-hover); }
.secondary-button { border-color: var(--line-strong); color: var(--ink); background: transparent; }
.secondary-button:hover:not(:disabled) { border-color: var(--pine); color: var(--pine); background: var(--pine-soft); }
.quiet-button { min-height: 44px; padding: 9px 12px; color: var(--muted); background: transparent; font-weight: 500; }
.quiet-button:hover:not(:disabled) { color: var(--pine); background: var(--pine-soft); }
.primary-button .icon, .secondary-button .icon, .quiet-button .icon { width: 17px; height: 17px; }
.primary-button:disabled, .secondary-button:disabled, .quiet-button:disabled { border-color: var(--line); color: #737c70; background: #e6e9e1; }

/* The right rail is a set of notes, not a stack of cards. */
.progress-strip { margin-bottom: 24px; padding: 0 0 25px; border-bottom: 1px solid var(--line); }
.progress-top { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; }
.progress-top h2, .progress-top h3 { font-size: 15px; font-weight: 600; }
.progress-top strong { color: var(--pine); font-family: var(--serif); font-size: 25px; font-weight: 400; line-height: 1.2; }
.progress-top > span { color: var(--muted); font-size: 12px; }
.progress-track { display: flex; gap: 4px; margin: 17px 0 13px; }
.progress-track span { display: block; flex: 1 1 0; min-width: 0; height: 24px; border: 0; border-radius: 2px; background: #e5e9df; }
.progress-track span.done { background: var(--pine); }
.progress-track span.current { background: var(--orange); }
.progress-meta { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; color: var(--muted); font-size: 11px; }
.rail-section { padding: 0 0 22px; margin-bottom: 22px; border-bottom: 1px solid var(--line); }
.rail-section:last-child { padding-bottom: 0; margin-bottom: 0; border-bottom: 0; }
.rail-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 15px; color: var(--ink); font-size: 14px; font-weight: 600; }
.rail-title .icon { width: 17px; height: 17px; color: var(--pine); }
.rail-title h2, .rail-title h3 { font-size: inherit; }
.teacher-note { margin: 12px 0 0; padding: 0 0 0 13px; border-left: 2px solid #d49d79; color: var(--body-copy); font-size: 13px; line-height: 1.9; }
.teacher-note p:last-child { margin-bottom: 0; }
.avatar.teacher { color: #805b3c; background: #eddfd0; }
.person-line { display: flex; align-items: center; gap: 9px; margin-bottom: 12px; }
.person-line > div { min-width: 0; }
.person-line strong { display: block; font-size: 13px; line-height: 1.5; }
.person-line .small-copy, .person-line .muted { font-size: 11px; }
.classmate-mini { display: flex; align-items: flex-start; gap: 9px; margin: 12px 0; color: var(--body-copy); font-size: 12px; line-height: 1.7; }
.classmate-mini .avatar { width: 28px; height: 28px; font-size: 11px; }
.classmate-mini p { margin: 0; }
.small-copy { font-size: 12px; line-height: 1.75; }
.muted { color: var(--muted); }
.text-green { color: var(--pine); }
.bottom-nav { display: none; }

/* Course directory. */
.lesson-list { border-top: 1px solid var(--line-strong); }
.lesson-list-row { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto 18px; align-items: center; gap: 18px; width: 100%; min-height: 90px; padding: 18px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--ink); background: transparent; text-align: left; text-decoration: none; }
button.lesson-list-row:hover:not(:disabled), a.lesson-list-row:hover { background: #f0f2ea; }
.lesson-day { display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 0; color: var(--pine); font-family: var(--serif); font-size: 24px; font-weight: 400; line-height: 1.2; }
.lesson-day small { margin-bottom: 3px; color: var(--muted); font-family: var(--sans); font-size: 11px; letter-spacing: .07em; }
.lesson-list-info { min-width: 0; }
.lesson-list-title { margin-bottom: 4px; font-size: 15px; font-weight: 500; line-height: 1.55; }
.lesson-list-meta { color: var(--muted); font-size: 12px; line-height: 1.65; }
.lesson-state { display: inline-flex; align-items: center; gap: 5px; color: var(--pine); font-size: 11px; white-space: nowrap; }
.lesson-state .icon { width: 14px; height: 14px; }
.lesson-state.locked, .lesson-list-row.locked .lesson-day { color: var(--muted); }
.chevron { width: 18px; height: 18px; color: #788271; }
.filter-tabs { display: flex; align-items: center; flex-wrap: wrap; gap: 0 26px; margin: 22px 0 0; border-bottom: 1px solid var(--line); }
.filter-tab { min-height: 47px; padding: 11px 0; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); background: transparent; font-size: 13px; font-weight: 500; }
.filter-tab.active { border-bottom-color: var(--pine); color: var(--pine); }
.filter-tab:hover { color: var(--pine); }

/* Cohort: people and their practice, with restrained response actions. */
.class-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; margin: 25px 0 0; padding: 22px 0; border-top: 1px solid var(--line-strong); border-bottom: 1px solid var(--line); }
.class-stat { min-width: 0; color: var(--muted); font-size: 12px; }
.class-stat strong { display: block; margin-bottom: 5px; color: var(--ink); font-family: var(--serif); font-size: 29px; font-weight: 400; line-height: 1.25; }
.notice-line { display: flex; align-items: flex-start; gap: 9px; padding: 16px 0; border-bottom: 1px solid var(--line); color: var(--body-copy); font-size: 12px; line-height: 1.8; }
.notice-line .icon { width: 16px; height: 16px; margin-top: 3px; color: var(--orange); }
.notice-line p { margin: 0; }
.feed-list { margin: 0; }
.feed-item { padding: 23px 0 18px; border-bottom: 1px solid var(--line); }
.feed-head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.feed-head > div { min-width: 0; }
.feed-head strong { display: block; font-size: 13px; line-height: 1.5; }
.feed-head .small-copy, .feed-head time { color: var(--muted); font-size: 11px; }
.feed-head time, .feed-head > .tag { margin-left: auto; }
.feed-body { margin: 13px 0 10px 44px; color: var(--body-copy); font-size: 14px; line-height: 1.85; }
.feed-body p:last-child { margin-bottom: 0; }
.feed-body [lang="en"], .feed-body .sentence-en { color: var(--ink); font-size: 16px; }
.feed-footer { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 19px; margin-left: 44px; color: var(--muted); font-size: 12px; }
.like-button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 9px 0; border: 0; border-radius: 4px; color: var(--muted); background: transparent; font-size: 12px; }
.like-button .icon { width: 16px; height: 16px; }
.like-button.active, .like-button:hover { color: var(--pine); }
.tag { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; padding: 3px 7px; border-radius: 4px; color: var(--pine); background: var(--pine-soft); font-size: 11px; line-height: 1.6; }
.empty-state { display: flex; flex-direction: column; align-items: center; max-width: 640px; margin: 0 auto; padding: 55px 20px; color: var(--muted); text-align: center; }
.empty-state > .icon { width: 30px; height: 30px; margin-bottom: 18px; color: var(--pine); }
.empty-state h2, .empty-state h3 { margin-bottom: 10px; color: var(--ink); font-size: 20px; font-weight: 500; }
.empty-state p { max-width: 32em; font-size: 13px; }

/* Personal progress: proof, dates and service details. */
.profile-header { display: flex; align-items: center; gap: 18px; padding: 7px 0 27px; border-bottom: 1px solid var(--line-strong); }
.profile-header .profile-avatar, .profile-header > .avatar { width: 62px; height: 62px; font-size: 21px; }
.profile-header > div { min-width: 0; }
.profile-header h1 { margin: 0 0 7px; font-size: 28px; letter-spacing: -.035em; }
.profile-header p { margin: 0; color: var(--muted); font-size: 12px; }
.profile-metrics { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; padding: 24px 0; border-bottom: 1px solid var(--line); }
.metric { min-width: 0; color: var(--muted); font-size: 12px; }
.metric-value { display: block; margin-bottom: 5px; color: var(--ink); font-family: var(--serif); font-size: 29px; font-weight: 400; line-height: 1.25; }
.profile-sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; gap: 30px 44px; margin-top: 30px; }
.profile-sections > * { min-width: 0; }
.profile-sections h2 { font-size: 17px; }
.profile-sections .section-heading { margin-top: 0; }
.settings-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 57px; padding: 13px 0; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; color: var(--body-copy); background: transparent; font-size: 13px; text-align: left; text-decoration: none; }
.settings-row > span:first-child { min-width: 0; }
.settings-row > .icon, .settings-row > .chevron { flex: 0 0 auto; }
button.settings-row:hover, a.settings-row:hover { color: var(--pine); }
.settings-row small { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.6; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; margin: 17px 0; }
.calendar-cell { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 30px; aspect-ratio: 1; border-radius: 4px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.calendar-cell.done { color: var(--pine); background: var(--pine-soft); }
.calendar-cell.today { color: #fffefa; background: var(--pine); font-weight: 600; }
.calendar-cell .icon { width: 15px; height: 15px; }
.order-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; padding: 17px 0; border-bottom: 1px solid var(--line); }
.order-row > div { min-width: 0; }

/* Dialogs and a focused speaking exercise. */

.dialog-wide { max-width: 720px; }

.modal-close { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; min-width: 44px; margin-right: -9px; padding: 11px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; }

.practice-progress { height: 3px; margin: 0 0 15px; overflow: hidden; border: 0; border-radius: 2px; background: #e2e7dd; }

.practice-counter { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.practice-sentence { margin: 20px 0 12px; color: var(--pine); font-family: var(--serif); font-size: 30px; font-weight: 400; line-height: 1.42; letter-spacing: -.015em; }

.focus-tip { display: flex; align-items: flex-start; gap: 9px; margin: 22px 0 10px; padding: 13px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); color: var(--body-copy); font-size: 12px; line-height: 1.8; }

.record-control { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px 0; }
.record-button { display: inline-flex; align-items: center; justify-content: center; width: 82px; height: 82px; min-width: 82px; padding: 24px; border: 1px solid var(--pine); border-radius: 50%; color: #fffefa; background: var(--pine); }
.record-button:hover { background: var(--pine-hover); }
.record-button .icon { width: 29px; height: 29px; }

.record-timer { color: var(--muted); font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; }
.record-wave { display: flex; align-items: center; justify-content: center; gap: 4px; height: 25px; color: var(--pine); }
.record-wave span { display: block; width: 3px; height: 10px; border-radius: 2px; background: currentColor; }

.record-control.recording .record-wave span, .record-wave.recording span { animation: yiduan-wave 800ms ease-in-out infinite alternate; }

.practice-actions { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px; margin-top: 13px; }

.switch { position: relative; display: inline-flex; align-items: center; width: 44px; height: 44px; min-width: 44px; flex: 0 0 44px; padding: 0; border: 0; border-radius: 6px; background: transparent; }

.switch.on::before { background: var(--pine); }

.toast { position: fixed; z-index: 200; bottom: 26px; left: calc(50% + var(--sidebar-width) / 2); display: flex; align-items: center; justify-content: center; gap: 9px; width: max-content; max-width: min(520px, calc(100% - 48px)); padding: 12px 18px; border-radius: 6px; color: #fffefa; background: #203a2d; font-size: 13px; line-height: 1.7; opacity: 0; pointer-events: none; transform: translate(-50%, 12px); transition: opacity 160ms ease, transform 160ms ease; }

.input, .textarea { display: block; width: 100%; min-width: 0; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 6px; color: var(--ink); background: var(--surface); font-size: 15px; line-height: 1.65; }

  async function startRecording() {

      if (SpeechRecognition) {
        try {
          recognizer = new SpeechRecognition(); recognizer.lang = 'en-US'; recognizer.interimResults = true; recognizer.continuous = true;
          recognizer.onresult = event => { session.transcript = Array.from(event.results).map(result => result[0].transcript).join(' '); };
          recognizer.onerror = () => {};
          recognizer.start();
        } catch { recognizer = null; }
      }
      recordingSeconds = 0;
      updateRecordingUi();
      recordingTimer = setInterval(() => { recordingSeconds++; updateRecordingUi(); if (recordingSeconds >= 60) stopRecording(false); }, 1000);
    } catch (error) {
      if (requestId !== micRequestId) return;
      pendingMic = false;
      recordingStream?.getTracks().forEach(track => track.stop());
      recordingStream = null; recorder = null;
      if (practice !== activePractice) return;
      practice.micError = error.name === 'NotAllowedError' ? '麦克风没有开启。请在浏览器中允许录音，或先完成朗读练习。' : error.name === 'NotFoundError' ? '没有找到麦克风，请连接设备后重试。也可以先完成朗读练习。' : '麦克风暂时无法使用，请关闭其他录音应用后再试。';

  function updateRecordingUi() {
    const button = document.querySelector('.record-button');
    if (button) { button.disabled = false; button.classList.add('recording'); button.innerHTML = icon('stop'); button.setAttribute('aria-label', '结束录音'); }
    const label = document.getElementById('record-label'); if (label) label.textContent = '正在录音，点击结束';
    const timer = document.getElementById('record-timer'); if (timer) timer.textContent = `00:${two(recordingSeconds)}`;
    document.querySelectorAll('[data-action="practice-listen"], [data-action="self-read"], [data-action="practice-rate"]').forEach(button => button.disabled = true);
  }
  function stopRecording(cancelled) {

      const label = document.getElementById('record-label'); if (label) label.textContent = '正在保存录音…';
    }
    if (recording) recording.cancelled = !!cancelled;
    clearInterval(recordingTimer); recordingTimer = null;
    try { recognizer?.stop(); } catch {}
    recognizer = null;

  async function saveRecording(day, index, item) {
    if (!window.indexedDB || !item?.blob) return;
    return new Promise(resolve => {
      const request = indexedDB.open('yiduan-audio', 1);
      request.onupgradeneeded = () => { const db = request.result; if (!db.objectStoreNames.contains('recordings')) db.createObjectStore('recordings', { keyPath: 'id' }); };
      request.onerror = () => resolve(false);
      request.onsuccess = () => {
        const db = request.result;
        try { const tx = db.transaction('recordings', 'readwrite'); tx.objectStore('recordings').put({ id: `${day}-${index}`, day, index, blob: item.blob, transcript: item.transcript, at: new Date().toISOString() }); tx.oncomplete = () => { db.close(); resolve(true); }; tx.onerror = () => { db.close(); resolve(false); }; } catch { db.close(); resolve(false); }
      };

      case 'save-profile': {
        const name = document.getElementById('profile-name').value.trim(); if (!name) { toast('请填写昵称。'); break; }
        state.profile = { name: name.slice(0, 20), goal: document.getElementById('profile-goal').value.trim().slice(0, 80) || '从日常英语开始' }; persist(); closeModal(); render(); toast('资料已保存'); break;
      }
      case 'next-course': showNextCourse(); break;
      case 'reserve-course': state.reservation = !state.reservation; persist(); render(); showNextCourse(); toast(state.reservation ? '已预约下一期' : '已取消预约'); break;
      case 'records': showRecords(); break;
      case 'record-detail': await recordDetail(Number(button.dataset.day)); break;
      case 'play-record-sentence': speak(lessonByDay(Number(button.dataset.day)).sentences[Number(button.dataset.index)].en, button); break;
      case 'review-record': closeModal(); go('today', Number(button.dataset.day)); startPractice(); break;
    }
  });
  document.addEventListener('keydown', event => {
    if (!currentModal) return;
    if (event.key === 'Escape') { closeModal(); return; }
    if (event.key === 'Tab') {
      const controls = Array.from(document.querySelectorAll('.modal button:not([disabled]), .modal [href], .modal input, .modal select, .modal textarea, .modal audio[controls], .modal summary')).filter(el => el.offsetParent !== null);
      if (!controls.length) { event.preventDefault(); return; }
      const first = controls[0], last = controls[controls.length - 1];
      if (event.shiftKey && document.activeElement === first) { last.focus(); event.preventDefault(); }
      else if (!event.shiftKey && document.activeElement === last) { first.focus(); event.preventDefault(); }
    }
  });
  window.addEventListener('hashchange', () => { const next = location.hash.slice(1); if (['today', 'courses', 'class', 'me'].includes(next)) { closeModal(); go(next); } });
  window.addEventListener('pagehide', () => { stopRecording(true); stopSpeech(); audioUrls.forEach(revokeUrl); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && recording) stopRecording(false); });
  persist(); render();
})();

</script>
</body>
</html>
